name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"
      - "components/**"
      - "context/**"
      - "pages/**"
      - "public/**"
      - "services/**"
      - "App.tsx"
      - "index.html"
      - "index.tsx"
      - "package-lock.json"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install user deps
        run: npm ci

      - name: Build user app
        run: npm run build -- --base=/user/

      - name: Add user SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Install admin deps
        run: cd admin-panel && npm ci

      - name: Build admin app
        run: cd admin-panel && npm run build -- --base=/admin/

      - name: Add admin SPA fallback
        run: cp admin-panel/dist/index.html admin-panel/dist/404.html

      - name: Assemble Pages output
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/admin pages-dist/user
          cp -R admin-panel/dist/. pages-dist/admin/
          cp -R dist/. pages-dist/user/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
